      the parastatal is required to coordinate with the ULG(s) while preparing its sectoral plans.
    evidence: Relevant Parastatal Act; applicable Town and Country Planning (T&CP) Act.
    zero_sentences: [0 — No formal role for the ULG in preparation of the parastatal’s plan can be established.]
    scan: [plan|planning|scheme|development plan|master plan, consult|concurrence|coordinat|municipal|urban local|ULG|local
        authorit|local bod|city corporation]
    review_status: draft
    needs_decision: true
    why: Check sentence gives ['LEGAL_BASE', 'RULES', 'TCP'], Evidence gives ['LEGAL_BASE', 'TCP']; the union is used
    note: ''
    pass1_check: [LEGAL_BASE, RULES, TCP]
    pass2_evidence: [LEGAL_BASE, TCP]
