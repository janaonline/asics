# Which sources a question needs before a score of 0 is allowed (Parastatal category).
#
# One row per scored question (52). Built from the question bank's "Check ..." sentence and its
# Evidence / Source Requirement; each row is derived twice and the final row is the UNION of the two
# (stricter). review_status "draft": nothing here has been reviewed by a person. When unsure, a row
# requires MORE: an over-strict row only keeps today's blank, a loose row could allow a false zero.
#
# requires: a list of groups. Every group needs at least one usable row whose "useful_for" carries
#   one of the group's tags (the finder's tags: [ACT], [RULES], [TCP], [ULG-LAW], [BUDGET], [AR], ...).
#   LEGAL_BASE = the parent Act ([ACT]) of a statutory agency, or the constitution document
#   ([CONSTITUTION]: MoA/AoA, incorporation order, board resolution) of an agency with no parent Act
#   (a general "Companies Act" or "Societies Registration Act" is not a parent Act).
#   WEBPAGE = the pages of the agency's own site reached from the home page menu, counted only when the
#   site crawl is COMPLETE (every menu link captured; the home row's Notes say "SITE-CRAWL: complete").
#   Without it the gate answers "Missing: complete site crawl" (see docs/REQUIRED_SOURCES_DECISIONS.md).
# scan: the full-text scan. A passage that matches every pattern in the list blocks an
#   absence-based zero (patterns are regular expressions, case-insensitive).
# zero_kind: absence | condition | mixed | none (none: the methodology states no zero condition).
legal_base_overrides: {}  # e.g. {WATCO: constitution}; the classifier reads Governing Act text otherwise
