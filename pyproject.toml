[project]
name = "asics-agent"
version = "0.1.0"
description = "LangGraph agents for Janaagraha's ASICS (Annual Survey of India's City-Systems) assessment work"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.6",
    "langchain-core>=0.3",
    "langchain-anthropic>=0.3",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
    "openpyxl>=3.1.5",
    "httpx>=0.28.1",
    "pypdf>=6.19.0",
    "streamlit>=1.64.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.3",
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/asics_agent"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# Line length is handled by `ruff format`; long user-facing message strings are fine.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
